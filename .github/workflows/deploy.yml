name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer push cancel an in-flight deploy instead of queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # Repo variables (Settings > Secrets and variables > Actions > Variables).
          # EmailJS public keys are meant to be readable in client code, so
          # variables are fine here; use secrets if you prefer them hidden in logs.
          VITE_EMAILJS_SERVICE_ID: ${{ vars.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_ORDER_TEMPLATE_ID: ${{ vars.VITE_EMAILJS_ORDER_TEMPLATE_ID }}
          VITE_EMAILJS_CONTACT_TEMPLATE_ID: ${{ vars.VITE_EMAILJS_CONTACT_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ vars.VITE_EMAILJS_PUBLIC_KEY }}
          # bestimpo.github.io is a user/org site served at the domain root,
          # so the base stays "/". For a project page set VITE_BASE=/<repo>/.
          VITE_BASE: /
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
