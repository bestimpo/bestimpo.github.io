<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404 — Bestimpo</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      :root {
        color-scheme: dark;
        --navy: #0b1b2b;
        --navy-800: #1b4a6b;
        --brand: #3b95f6;
        --brand-200: #bfe2fe;
        --brand-300: #93cffd;
        --neon: #0fc8ba;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 15% 10%, rgb(59 149 246 / 0.28), transparent 45%),
          radial-gradient(circle at 85% 0%, rgb(15 200 186 / 0.2), transparent 42%),
          var(--navy);
        color: var(--brand-200);
        font:
          400 16px/1.6 'Inter',
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        text-align: center;
      }
      .card {
        width: 100%;
        max-width: 520px;
        padding: 40px 28px;
        border: 1px solid rgb(255 255 255 / 0.1);
        border-radius: 24px;
        background: rgb(255 255 255 / 0.05);
        backdrop-filter: blur(16px);
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
      }
      h1 {
        margin: 20px 0 0;
        font-size: 56px;
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #fff;
      }
      p {
        margin: 12px 0 0;
      }
      .muted {
        font-size: 14px;
        color: rgb(147 207 253 / 0.7);
      }
      .actions {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
      }
      a {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 22px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: 0.2s;
      }
      .primary {
        background: linear-gradient(to right, var(--brand), var(--neon));
        color: var(--navy);
        box-shadow: 0 18px 45px -20px rgb(59 149 246 / 0.55);
      }
      .primary:hover {
        filter: brightness(1.1);
      }
      .ghost {
        border: 1px solid rgb(255 255 255 / 0.15);
        background: rgb(255 255 255 / 0.05);
        color: var(--brand-200);
      }
      .ghost:hover {
        border-color: rgb(59 149 246 / 0.6);
        background: rgb(255 255 255 / 0.1);
      }
    </style>

    <script>
      // GitHub Pages serves this file for any path it cannot find. The app uses
      // HashRouter, so a bare deep link such as /shop or /product/foo arrives
      // here instead of the app. Forward it to the equivalent hash route so the
      // link still works, and let the app render its own 404 for unknown routes.
      //
      // BASE is "/" for this user/org site (bestimpo.github.io). For a project
      // page served from https://<user>.github.io/<repo>/, set it to "/<repo>/".
      ;(function () {
        var BASE = '/'

        // Already a hash URL — the app is handling it, nothing to forward.
        if (window.location.hash) return

        var path = window.location.pathname
        if (path.indexOf(BASE) === 0) path = path.slice(BASE.length)
        path = path.replace(/^\/+/, '').replace(/index\.html$/, '')

        // Nothing meaningful to carry over: just go to the home page.
        var target = BASE + (path ? '#/' + path + window.location.search : '')
        window.location.replace(target)
      })()
    </script>
  </head>
  <body>
    <div class="card">
      <img src="/favicon.png" alt="Bestimpo" />
      <h1>404</h1>
      <p>That page — or that product — is not on our shelves.</p>
      <div class="actions">
        <a class="primary" href="/#/shop">Browse the shop</a>
        <a class="ghost" href="/">Back home</a>
      </div>
    </div>
  </body>
</html>
